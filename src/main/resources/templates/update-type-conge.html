<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de Bord - Gestion Types de Congé</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    /* CSS for the sticky form on the left */
    .sticky-top-custom {
        top: 20px;
    }
  </style>
</head>

<body class="pb-5">

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="p-3 p-md-5">
  <div class="container-fluid container-lg">
    <header class="text-center mb-5">
      <h1 class="display-5 fw-bolder text-primary mb-2">Gestion des Types de Congé</h1>
    </header>

    <div class="row g-4">

      <div class="col-lg-4">
        <div class="card p-4 bg-white card-custom h-100 sticky-top-custom">
          <h2 class="h4 fw-semibold mb-4 text-dark">Modifer Type de Congé : <span th:text="${typeConge.libelle}"></span></h2>

          <form th:action="@{/updateTypeConge/{id}(id=${typeConge.id})}" th:object="${typeConge}" method="post" id="add-typeconge-form" class="space-y-4">

            <div th:if="${#fields.hasErrors('global')}" class="alert alert-danger" role="alert">
              <p th:each="err : ${#fields.errors('global')}" th:text="${err}"></p>
            </div>

            <div class="mb-3">
              <label for="libelle" class="form-label text-sm text-secondary mb-1">Libellé du Congé</label>
              <input th:field="*{libelle}" type="text" id="libelle" required
                     class="form-control" th:classappend="${#fields.hasErrors('libelle')} ? 'is-invalid' : ''" style="border-radius: 0.5rem;">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('libelle')}" th:errors="*{libelle}">Libellé Error</div>
            </div>

            <div class="mb-3">
              <label for="quotaAnnuel" class="form-label text-sm text-secondary mb-1">Quota Annuel (jours)</label>
              <input th:field="*{quotaAnnuel}" type="number" id="quotaAnnuel" required min="0"
                     class="form-control" th:classappend="${#fields.hasErrors('quotaAnnuel')} ? 'is-invalid' : ''" style="border-radius: 0.5rem;">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('quotaAnnuel')}" th:errors="*{quotaAnnuel}">Quota Annuel Error</div>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100 py-2 fw-medium shadow-sm">
              Modifier le Type de Congé
            </button>
            <div id="status-message" class="text-sm text-center mt-2 d-none"></div>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card p-4 bg-white card-custom">

          <form id="filter-typeconge-form" class="mb-4" method="get" th:action="@{/typeCongeFilter}">
            <div class="d-flex flex-column flex-md-row gap-3 align-items-end">

              <div class="flex-fill w-100">
                <label for="search-input" class="form-label text-sm text-secondary mb-1">Rechercher Par Libellé</label>
                <input type="text" id="search-input" name="search"
                       class="form-control" placeholder="Entrez un libellé" style="border-radius: 0.5rem;">
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-medium shadow-sm w-md-auto" style="min-width: 150px;">
                Filtrer
              </button>
            </div>
          </form>
          <hr class="mb-4 mt-0"/>

          <h2 class="h4 fw-semibold mb-4 text-dark">Liste des Types de Congé (<span th:text="${typeConges != null ? typeConges.size() : 0}" id="typeconge-count">0</span>)</h2>

          <div class="d-none d-md-block table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
              <tr class="text-start text-xs text-primary text-uppercase tracking-wider">
                <th scope="col" class="py-3 px-3">Libellé</th>
                <th scope="col" class="py-3 px-3">Quota Annuel</th>
                <th scope="col" class="py-3 px-3 text-end">Actions</th>
              </tr>
              </thead>
              <tbody id="typeconge-list-desktop">

              <tr th:each="typeConge : ${typeConges}">
                <td th:text="${typeConge.libelle}"></td>
                <td th:text="${typeConge.quotaAnnuel} + ' jours'"></td>
                <td class="text-end">
                  <div class="btn-group" role="group">
                    <a th:href="@{/editTypeConge/{id}(id=${typeConge.id})}" class="btn btn-sm btn-info text-white me-2">
                      <i class="fas fa-edit"></i> Éditer
                    </a>
                    <a th:href="@{/deleteTypeConge/{id}(id=${typeConge.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce type de congé ?')">
                      <i class="fas fa-trash-alt"></i> Supprimer
                    </a>
                  </div>
                </td>
              </tr>

              <tr th:if="${typeConges == null or typeConges.empty}">
                <td colspan="3" class="text-center py-4 text-secondary">Aucun type de congé n'a été ajouté pour le moment.</td>
              </tr>
              </tbody>
            </table>
          </div>

          <div id="typeconge-list-mobile" class="d-md-none space-y-3">
            <div th:each="typeConge : ${typeConges}" class="card p-3 mb-2 shadow-sm">
              <h5 th:text="${typeConge.libelle}" class="mb-1 text-primary"></h5>
              <p class="mb-1 small">Quota: <span th:text="${typeConge.quotaAnnuel} + ' jours'"></span></p>
              <div class="btn-group w-100" role="group">
                <a th:href="@{/editTypeConge/{id}(id=${typeConge.id})}" class="btn btn-sm btn-outline-info">Éditer</a>
                <a th:href="@{/deleteTypeConge/{id}(id=${typeConge.id})}" class="btn btn-sm btn-outline-danger"
                   onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce type de congé ?')">Supprimer</a>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
